<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX -XMLHttpRequest</title>
    <style>
        #container {
            text-align: center;
        }

        img {
            margin: 1rem auto;
        }
    </style>
</head>

<body>
    <div id="container">
        <h1 style="text-align: center;">Understanding the concept of XMLHttpRequest..</h1>
        <h4>Find Profiles of Github Users</h4>
        <form action="" id="userForm">
            <label for="uname">UserName: </label>
            <input type="text" id="uname">
            <button type="submit">Find Profile</button>
        </form>
        <div id="profile" style="display: none;">
            <img src="" id="avatar" alt="" height="300" width="300" style="border-radius: 2rem;">
            <ul style="list-style: none; font-family: sans-serif; font-size: large; font-weight: 700;">
                <li id="id"></li>
                <li id="name"></li>
                <li id="followers"></li>
                <li id="following"></li>
            </ul>
        </div>
        <h3 id="error"></h3>
    </div>

    <script>
        const avatar = document.querySelector('#avatar');
        const id = document.querySelector('#id');
        const name = document.querySelector('#name');
        const followers = document.querySelector('#followers');
        const following = document.querySelector('#following');
        const userForm = document.querySelector('#userForm');

        userForm.addEventListener('submit', (event) => {
            event.preventDefault();
            const uname = String(document.querySelector('#uname').value);
            const userURL = `https://api.github.com/users/${uname}`;
            showResult(userURL);
        })

        let userData = {};

        const showResult = (userURL) => {
            const xhr = new XMLHttpRequest();
            xhr.open('GET', userURL);
            xhr.onreadystatechange = function () {
                if (xhr.readyState === 4 && xhr.status === 200) {
                    const dataReceived = JSON.parse(this.responseText);
                    userData = dataReceived;
                    avatar.setAttribute('src', userData.avatar_url);
                    id.textContent = `ID:  ${userData.id}`;
                    name.textContent = `Name:  ${userData.name}`;
                    followers.textContent = `Followers:  ${userData.followers}`;
                    following.textContent = `Following:  ${userData.following}`;
                    const profile = document.querySelector('#profile');
                    profile.style.display = '';
                }
            }
            xhr.send();
        }
    </script>
</body>

</html>
