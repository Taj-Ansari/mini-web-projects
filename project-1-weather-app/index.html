<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Info..</title>
    <style>
        h1 {
            text-align: center;
        }

        #formSection {
            text-align: center;
        }
    </style>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Real-Time Weather Monitor</h1>
    <hr>
    <div id="formSection">
        <form action="#" id="cityForm">
            <label for="location">Location: </label>
            <input type="text" id="city">
            <button type="submit">Fetch Details</button>
        </form>
        <br>
        <form action="" id="stateForm">
            <label for="stateSelect">Select State</label>
            <select name="stateName" id="stateSelect">
                <option value=""> &nbsp SELECT &nbsp </option>
            </select>
        </form>
    </div>
    <div class="weather-container">
        <!-- Search and Location Header -->
        <div class="weather-header">
            <h2 id="location-name">New York, US</h2>
            <p id="current-date">Sunday, 3:23 PM</p>
        </div>

        <!-- Main Temperature Display -->
        <div class="weather-main">
            <div class="condition-icon-wrapper">
                <!-- You can replace this text with an image tag or icon library link later -->
                <img src="" alt="" id="weather-icon" class="weather-icon">
            </div>
            <div class="temperature-wrapper">
                <span id="current-temperature">24</span>
                <span class="temperature-unit">°C</span>
            </div>
            <p id="weather-description">Clear Sky</p>
        </div>

        <!-- Detailed Weather Metrics -->
        <div class="weather-details">
            <div class="detail-item">
                <span class="detail-label">Feels Like</span>
                <span id="feels-like-temperature" class="detail-value">26°C</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Humidity</span>
                <span id="humidity-percentage" class="detail-value">45%</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Wind Speed</span>
                <span id="wind-speed" class="detail-value">12 km/h</span>
            </div>

            <div class="detail-item">
                <span class="detail-label">Pressure</span>
                <span id="atmospheric-pressure" class="detail-value">1013 hPa</span>
            </div>
        </div>
    </div>

    <script src="weather.js"></script>
</body>

</html>
